<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password | INS Firm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .login-box h2 {
            font-family: 'Playfair Display', serif;
            color: #D4AF37;
            font-size: 1.8rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <!-- Global Logo -->
        <div class="logo" style="position: absolute; top: 30px; left: 60px; display: flex; align-items: center; z-index: 100; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: 2px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="INS FIRM Logo" style="height: 45px; width: auto; margin-right: 15px; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3));">
            <span style="color: #D4AF37;">INS</span> FIRM
        </div>

        <div class="login-box">
            <h2>Set New Password</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div style="color: {% if category == 'error' %}#ff4d4d{% else %}#4dff4d{% endif %}; background: {% if category == 'error' %}rgba(255, 77, 77, 0.1){% else %}rgba(77, 255, 77, 0.1){% endif %}; border: 1px solid {% if category == 'error' %}#ff4d4d{% else %}#4dff4d{% endif %}; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align:center;">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('reset_password') }}" method="POST">
                <input type="password" name="new_password" placeholder="New Password" required minlength="6">
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required minlength="6">
                <button type="submit" class="btn">Update Password</button>
            </form>
        </div>
    </div>
</body>
</html>
