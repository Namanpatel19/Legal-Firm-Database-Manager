<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Portal | INS Firm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="overlay">

    <!-- Home Button -->
    <a href="/" style="position: absolute; top: 30px; right: 40px; z-index: 200; background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.5); color: #D4AF37; padding: 8px 18px; border-radius: 25px; font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: 0.3s; letter-spacing: 0.5px;" onmouseover="this.style.background='rgba(212,175,55,0.3)'" onmouseout="this.style.background='rgba(212,175,55,0.15)'">🏠 Home</a>

    <!-- Global Logo -->
    <div class="logo" style="position: absolute; top: 30px; left: 60px; display: flex; align-items: center; z-index: 100; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: 2px;">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="INS FIRM Logo" style="height: 45px; width: auto; margin-right: 15px; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3));">
        <span style="color: #D4AF37;">INS</span> FIRM
    </div>

    <div class="dashboard-card">
        <h1>Welcome, {{ session.get('user_name', '') }}</h1>
        <p>Welcome back. Monitor your case progress securely.</p>
        <div class="action-grid">
            <a href="/client/case_status" class="tile">My Case Status</a>
            <a href="/client/hearing" class="tile">Next Hearing Date</a>
            <a href="/client/court_details" class="tile">Court Details</a>
            <a href="/client/verdict" class="tile">Verdict Details</a>
            <a href="/client/payment_history" class="tile">Payment History</a>
        </div>
        <a href="{{ url_for('logout') }}" class="btn-logout">Secure Logout</a>
    </div>
</div>
</body>
</html>
