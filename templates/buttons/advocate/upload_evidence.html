<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advocate Dashboard | Lex Firm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/advocate-button.css') }}">
    <!-- Custom styling for form elements if needed -->
    <style>
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        select, input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(212,175,55,0.3);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        select:focus, input[type="text"]:focus, input[type="file"]:focus, textarea:focus {
            border-color: #D4AF37;
            background: rgba(255,255,255,0.1);
        }
        select option {
            background: #1e1e1e;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="overlay">

    <!-- Global Logo -->
    <div class="logo" style="position: absolute; top: 30px; left: 60px; display: flex; align-items: center; z-index: 100; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: 2px;">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="INS FIRM Logo" style="height: 45px; width: auto; margin-right: 15px; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3));">
        <span style="color: #D4AF37;">INS</span> FIRM
    </div>

    <!-- Home Button -->
    <a href="/" style="position: absolute; top: 30px; right: 40px; z-index: 200; background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.5); color: #D4AF37; padding: 8px 18px; border-radius: 25px; font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: 0.3s;" onmouseover="this.style.background='rgba(212,175,55,0.3)'" onmouseout="this.style.background='rgba(212,175,55,0.15)'">🏠 Home</a>

    <div class="dashboard-card" style="max-width: 800px;">
        <h1>Upload Document / Evidence</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" style="color: white; background-color: {% if category == 'error' %}#ff4d4d{% else %}#4CAF50{% endif %}; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('advocate_pages', page='upload_evidence') }}" method="POST" enctype="multipart/form-data">
            
            <div class="form-row">
                <select name="submission_type" id="submissionType" required onchange="toggleFormFields()">
                    <option value="">Select Submission Type</option>
                    <option value="Evidence">Case Evidence</option>
                    <option value="Document">Personal Document (e.g. Aadhar, PAN)</option>
                </select>

                <select name="client_id" id="clientSelect" onchange="fetchCases()" required>
                    <option value="">Select Client</option>
                    {% for client in clients %}
                        <option value="{{ client.client_id }}">{{ client.first_name }} {{ client.last_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <div id="caseContainer">
                    <select name="case_id" id="caseSelect">
                        <option value="">Select Case ID</option>
                    </select>
                </div>

                <input type="text" name="evidence_title" placeholder="Title (e.g. Aadhar Card)" required>
            </div>

            <div class="form-row">
                <select name="evidence_type" id="evidenceType">
                    <option>Document</option>
                    <option>Image</option>
                    <option>Video</option>
                    <option>Physical</option>
                </select>

                <input type="file" name="file_path" required>
            </div>

            <textarea name="description" placeholder="Describe the relevance of this file..." style="width:100%; height:80px; background:rgba(255,255,255,0.08); border:1px solid var(--glass-border); color:white; padding:15px; border-radius:10px; font-family:inherit;"></textarea>
            
            <button type="submit" class="btn-submit" style="margin-top:20px; width:100%;">Securely Upload to Vault</button>
        </form>
        <a href="{{ url_for('advocate_dashboard') }}" class="back-link" style="display:inline-block; margin-top:20px;">← Back</a>
    </div>
</div>

<script>
    function toggleFormFields() {
        const submissionType = document.getElementById('submissionType').value;
        const caseContainer = document.getElementById('caseContainer');
        const caseSelect = document.getElementById('caseSelect');
        const evidenceType = document.getElementById('evidenceType');

        if (submissionType === 'Document') {
            // For general documents, case is optional/not-needed
            caseContainer.style.display = 'none';
            caseSelect.required = false;
            // Limit types for standard documents if desired, or keep as is.
        } else {
            // For evidence, case is required
            caseContainer.style.display = 'block';
            caseSelect.required = true;
        }
    }

    function fetchCases() {
        const clientId = document.getElementById('clientSelect').value;
        const caseSelect = document.getElementById('caseSelect');
        
        // Reset cases
        caseSelect.innerHTML = '<option value="">Select Case ID</option>';
        
        if (!clientId) return;

        fetch(`/api/cases_for_client/${clientId}`)
            .then(response => response.json())
            .then(data => {
                data.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.case_id;
                    opt.textContent = `${c.case_number} - ${c.case_title}`;
                    caseSelect.appendChild(opt);
                });
            })
            .catch(err => console.error("Error fetching cases:", err));
    }

    // Initialize state on load
    document.addEventListener("DOMContentLoaded", () => {
        toggleFormFields();
    });
</script>

</body>
</html>
